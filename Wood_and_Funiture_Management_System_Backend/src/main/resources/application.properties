# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/timber_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=dGltYmVyX2Z1cm5pdHVyZV9tYW5hZ2VtZW50X3N5c3RlbV8yMDI2X3NlY3JldF9rZXlfMjU2Cg==
#jwt.expiration=300000
jwt.expiration=86400000
# 5 minutes = 300000 milliseconds
jwt.refresh-expiration=86400000
# 24 hours refresh token to allow some leeway but strict access token

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.timber=DEBUG

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Colombo

# CORS Configuration
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
<div class="dashboard-layout">
    <!-- Navigation Sidebar -->
    <app-admin-side></app-admin-side>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Dynamic Header -->
        <app-header></app-header>

        <!-- Dashboard Body / Child Routes -->
        <div class="content-body">
            <!-- For now, we show a welcome message. 
                 Later, this could have <router-outlet> for child views -->
            <div class="welcome-section">
                <h1>Welcome to Sachintha Timber Mall</h1>
                <p>Manage your wood and furniture inventory efficiently.</p>
            </div>

            <!-- Stats Grid placeholder -->
            <div class="stats-grid">
                <div class="stat-card" routerLink="/user-management" style="cursor: pointer;">
                    <i class="bi bi-people"></i>
                    <div class="stat-info">
                        <h3>Users</h3>
                        <p>Manage Staff & Roles</p>
                    </div>
                </div>
                <div class="stat-card" routerLink="/employee-management" style="cursor: pointer;">
                    <i class="bi bi-person-badge"></i>
                    <div class="stat-info">
                        <h3>Employees</h3>
                        <p>Staff Records & Status</p>
                    </div>
                </div>
                <div class="stat-card" routerLink="/supplier-management" style="cursor: pointer;">
                    <i class="bi bi-truck"></i>
                    <div class="stat-info">
                        <h3>Suppliers</h3>
                        <p>Manage Contributors</p>
                    </div>
                </div>
                <div class="stat-card" routerLink="/customer-management" style="cursor: pointer;">
                    <i class="bi bi-person-heart"></i>
                    <div class="stat-info">
                        <h3>Customers</h3>
                        <p>Client Directory</p>
                    </div>
                </div>
                <div class="stat-card" routerLink="/supply-request-management" style="cursor: pointer;">
                    <i class="bi bi-clipboard-check"></i>
                    <div class="stat-info">
                        <h3>Supply</h3>
                        <p>Material Requests</p>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions-section mt-5">
                <h3 class="mb-4">Quick Actions</h3>
                <div class="actions-grid">
                    <button class="btn btn-action-card" routerLink="/register">
                        <i class="bi bi-person-plus"></i>
                        <span>Add New Staff</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/supply-request-management">
                        <i class="bi bi-clipboard-plus"></i>
                        <span>New Supply Request</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/quotation-management">
                        <i class="bi bi-file-earmark-plus"></i>
                        <span>Create Quotation</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/order-management">
                        <i class="bi bi-cart-plus"></i>
                        <span>Create Order</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/log-management">
                        <i class="bi bi-tree"></i>
                        <span>Log Management</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/attendance-management">
                        <i class="bi bi-calendar-check"></i>
                        <span>Record Attendance</span>
                    </button>
                    <button class="btn btn-action-card" routerLink="/payroll-management">
                        <i class="bi bi-wallet2"></i>
                        <span>Run Payroll</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

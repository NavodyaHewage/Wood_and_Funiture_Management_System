<div class="dashboard-layout">
    <app-admin-side></app-admin-side>

    <main class="main-content">
        <app-header></app-header>

        <div class="content-body">
            <div class="welcome-section">
                <h1>Welcome Back, {{ currentUser?.username }}</h1>
                <p>Sachintha Timber Mall &mdash; Supplier Partner Portal</p>
            </div>

            <div class="menu-group-section">
                <h2 class="category-heading">SUPPLIER WORKSPACE</h2>

                <div class="actions-grid">
                    <div class="action-card-premium" *ngFor="let card of supplierCards" [routerLink]="card.route">
                        <div class="card-glow-overlay"></div>

                        <div class="card-header-icon">
                            <div class="card-icon-container">
                                <i class="bi" [ngClass]="card.icon"></i>
                            </div>
                        </div>

                        <div class="card-body-content">
                            <h3>{{ card.name }}</h3>
                            <p>{{ card.description }}</p>
                        </div>

                        <div class="card-footer-action">
                            <span>Access Module</span>
                            <i class="bi bi-arrow-right-short"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

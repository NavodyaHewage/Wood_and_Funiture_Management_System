<div class="dashboard-layout">
    <!-- Admin Sidebar as requested -->
    <app-admin-side></app-admin-side>

    <main class="main-content">
        <!-- Header as requested -->
        <app-header></app-header>

        <div class="content-body">
            <div class="dashboard-controls mb-4">
                <div class="title-section">
                    <h1 class="premium-title">Supplier Dashboard</h1>
                    <p class="text-muted premium-subtitle">Welcome to your supplier portal. Manage your supplies here.</p>
                </div>
            </div>

            <!-- Premium Dashboard Cards -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="premium-card info-card card-primary">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-circle">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <div class="ms-3">
                                <h6 class="text-muted mb-1">Total Supplies</h6>
                                <h2 class="mb-0 fw-bold">124</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="premium-card info-card card-success">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-circle">
                                <i class="bi bi-check-circle"></i>
                            </div>
                            <div class="ms-3">
                                <h6 class="text-muted mb-1">Approved</h6>
                                <h2 class="mb-0 fw-bold">110</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="premium-card info-card card-warning">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-circle">
                                <i class="bi bi-clock-history"></i>
                            </div>
                            <div class="ms-3">
                                <h6 class="text-muted mb-1">Pending Validation</h6>
                                <h2 class="mb-0 fw-bold">14</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div class="premium-card p-4">
                <h4 class="mb-3">Recent Activity</h4>
                <p class="text-muted">No recent activity to display.</p>
            </div>
        </div>
    </main>
</div>

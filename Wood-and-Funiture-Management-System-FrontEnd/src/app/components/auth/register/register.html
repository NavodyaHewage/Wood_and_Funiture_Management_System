<div class="dashboard-layout">
    <app-admin-side></app-admin-side>

    <main class="main-content">
        <app-header></app-header>

        <div class="content-body">
            <div class="admin-header-box mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="header-icon-circle">
                        <i class="bi bi-person-fill-add"></i>
                    </div>
                    <div>
                        <h1 class="admin-title">Create System User</h1>
                        <p class="admin-subtitle">Assign roles and credentials for new staff members</p>
                    </div>
                </div>
                <button class="btn btn-wood-outline" routerLink="/user-management">
                    <i class="bi bi-arrow-left"></i> Back to Directory
                </button>
            </div>

            <div class="admin-card">
                <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="admin-form">
                    <!-- User Type Selection -->
                    <div class="form-section-title">
                        <i class="bi bi-people-fill"></i> Registration Type
                    </div>
                    <div class="row g-4 mb-4">
                        <div class="col-md-6 d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="userType" id="systemUser"
                                    [value]="true" [(ngModel)]="registerData.isSystemUser">
                                <label class="form-check-label" for="systemUser">System User</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="userType" id="nonSystemUser"
                                    [value]="false" [(ngModel)]="registerData.isSystemUser">
                                <label class="form-check-label" for="nonSystemUser">Non-System User</label>
                            </div>
                        </div>
                    </div>

                    <!-- Role / Entity Selection -->
                    <div class="row g-4 mb-5">
                        <div class="col-md-6" *ngIf="registerData.isSystemUser">
                            <label class="admin-label">User Role</label>
                            <div class="admin-input-group">
                                <i class="bi bi-person-badge"></i>
                                <select name="role" [(ngModel)]="registerData.role" required>
                                    <option value="ADMIN">Administrator</option>
                                    <option value="MANAGER">Manager</option>
                                    <option value="SUPPLIER">Supplier</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6" *ngIf="!registerData.isSystemUser">
                            <label class="admin-label">Entity Type</label>
                            <div class="admin-input-group">
                                <i class="bi bi-diagram-3-fill"></i>
                                <select name="entityType" [(ngModel)]="registerData.entityType" required>
                                    <option value="EMPLOYEE">Employee</option>
                                    <option value="SUPPLIER">Supplier</option>
                                    <option value="CUSTOMER">Customer</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Authentication Details (System Users Only) -->
                    <div *ngIf="registerData.isSystemUser">
                        <div class="form-section-title">
                            <i class="bi bi-shield-lock-fill"></i> Authentication Details
                        </div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-4">
                                <label class="admin-label">Username</label>
                                <div class="admin-input-group">
                                    <i class="bi bi-at"></i>
                                    <input type="text" name="username" [(ngModel)]="registerData.username"
                                        [required]="registerData.isSystemUser" placeholder="e.g. jsmith">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="admin-label">Password</label>
                                <div class="admin-input-group">
                                    <i class="bi bi-lock-fill"></i>
                                    <input type="password" name="password" [(ngModel)]="registerData.password"
                                        [required]="registerData.isSystemUser" placeholder="••••••••">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="admin-label">Confirm Password</label>
                                <div class="admin-input-group">
                                    <i class="bi bi-shield-check"></i>
                                    <input type="password" name="confirmPassword"
                                        [(ngModel)]="registerData.confirmPassword"
                                        [required]="registerData.isSystemUser" placeholder="••••••••">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Common & Dynamic Fields -->
                    <div class="form-section-title">
                        <i class="bi bi-person-vcard-fill"></i> Details
                    </div>
                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <label class="admin-label">Full Name / Entity Name</label>
                            <input type="text" name="fullName" [(ngModel)]="registerData.fullName" required
                                placeholder="Enter full name" class="admin-control">
                        </div>
                        <div class="col-md-6">
                            <label class="admin-label">Mobile Number</label>
                            <input type="text" name="mobile" [(ngModel)]="registerData.mobile" required
                                placeholder="e.g. 0771234567" class="admin-control">
                        </div>
                        <div class="col-md-6">
                            <label class="admin-label">Email Address</label>
                            <input type="email" name="email" [(ngModel)]="registerData.email"
                                placeholder="example@domain.com" class="admin-control">
                        </div>
                        <div class="col-md-6">
                            <label class="admin-label">Address</label>
                            <input type="text" name="address" [(ngModel)]="registerData.address"
                                placeholder="Enter residential or business address" class="admin-control">
                        </div>

                        <!-- NIC (Employee, Customer, Manager) -->
                        <div class="col-md-6"
                            *ngIf="registerData.entityType !== 'SUPPLIER' && registerData.role !== 'SUPPLIER'">
                            <label class="admin-label">NIC Number</label>
                            <input type="text" name="nic" [(ngModel)]="registerData.nic" placeholder="Enter NIC number"
                                class="admin-control">
                        </div>

                        <!-- Designation (Employee) -->
                        <div class="col-md-6"
                            *ngIf="registerData.entityType === 'EMPLOYEE' && !registerData.isSystemUser">
                            <label class="admin-label">Designation</label>
                            <input type="text" name="designation" [(ngModel)]="registerData.designation"
                                placeholder="e.g. Carpenter" class="admin-control">
                        </div>

                        <!-- Supplier Category (Supplier) -->
                        <div class="col-md-6"
                            *ngIf="registerData.entityType === 'SUPPLIER' || registerData.role === 'SUPPLIER'">
                            <label class="admin-label">Supplier Category</label>
                            <select name="supCat" [(ngModel)]="registerData.supCat" class="admin-control">
                                <option value="Regular">Regular (System Access)</option>
                                <option value="Local">Local</option>
                                <option value="International">International</option>
                                <option value="Specialized">Specialized</option>
                            </select>
                        </div>
                    </div>

                    <div class="admin-actions">
                        <button type="submit" class="btn btn-admin-primary"
                            [disabled]="!registerForm.form.valid || isLoading">
                            <i class="bi bi-check-circle-fill me-2" *ngIf="!isLoading"></i>
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ isLoading ? 'Processing...' : 'Complete Registration' }}
                        </button>
                        <button type="button" class="btn btn-admin-secondary" routerLink="/user-management">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<header class="main-header">
    <div class="header-content">
        <!-- Current Page Title -->
        <div class="page-info">
            <h2 class="page-title">{{ pageTitle$ | async }}</h2>
        </div>

        <!-- Right Side: Search & User Profile -->
        <div class="header-actions">
            <div class="search-bar d-none d-md-flex">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Search anything...">
            </div>

            <div class="user-profile" (click)="toggleDropdown($event)" tabindex="0" *ngIf="currentUser$ | async as user">
                <div class="user-info d-none d-lg-block">
                    <span class="user-name">Welcome, {{ user.username }}</span>
                    <span class="user-role">{{ isSupplier(user) ? 'Authorized Partner' : (user.role === 'Admin' ? 'System Administrator' : user.role) }}</span>
                </div>
                <div class="avatar-container">
                    <img src="/logo.jpg" alt="Profile" class="user-avatar">
                    <div class="status-indicator"></div>
                </div>
                <i class="bi bi-chevron-down ms-2 fs-7"></i>

                <!-- Profile Dropdown -->
                <div class="profile-dropdown" [class.show]="isDropdownOpen">
                    <div class="dropdown-header">
                        <p class="m-0 fw-bold">{{ user.username }} Account</p>
                        <p class="m-0 text-muted small">{{ user.email }}</p>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a [routerLink]="'/profile'" class="dropdown-item">
                        <i class="bi bi-person me-2"></i> My Profile
                    </a>
                    <a [routerLink]="'/change-password'" class="dropdown-item">
                        <i class="bi bi-shield-lock me-2"></i> Change Password
                    </a>
                    <div class="dropdown-divider"></div>
                    <button (click)="onLogout()" class="dropdown-item logout-btn">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

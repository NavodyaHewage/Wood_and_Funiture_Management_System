<div class="cft-widget-container">
    <!-- Floating Window (Chat Box style) -->
    <div class="cft-floating-card" *ngIf="isOpen" [@modalScale]>
        <div class="card-header">
            <div class="title-with-icon">
                            <i class="bi bi-calculator"></i>
                            <h2 style="color: white;">Timber CFT Tool</h2>
            </div>
            <button class="small-close" (click)="closeModal()">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="card-body">
            <!-- Inputs Section -->
            <form [formGroup]="logForm" class="tool-form">
                <div class="row gx-2">
                    <div class="col-6 mb-3">
                        <label>GIRTH (in)</label>
                        <div class="premium-input-sm" [class.has-error]="logForm.get('girthIn')?.invalid && logForm.get('girthIn')?.touched">
                            <input type="number" formControlName="girthIn" placeholder="0.0" (keypress)="onKeyPress($event)">
                        </div>
                    </div>
                    <div class="col-6 mb-3">
                        <label>LENGTH (ft)</label>
                        <div class="premium-input-sm" [class.has-error]="logForm.get('lengthFt')?.invalid && logForm.get('lengthFt')?.touched">
                            <input type="number" formControlName="lengthFt" placeholder="0.0" (keypress)="onKeyPress($event)">
                        </div>
                    </div>
                </div>

                <div class="col-12 mb-3">
                    <label>WOOD TYPE</label>
                    <div class="premium-input-sm">
                        <select formControlName="woodTypeId" (change)="onWoodTypeChange()">
                            <option [value]="null" disabled>Select</option>
                            <option *ngFor="let type of woodTypes" [value]="type.rmId">
                                {{ type.rmName }}
                            </option>
                        </select>
                    </div>
                </div>
            </form>

            <!-- Results Section -->
            <div class="results-box">
                <div class="result-item">
                    <span>Volume</span>
                    <div class="res-val">{{ currentVolume !== null ? (currentVolume | number:'1.3-3') : '0.000' }} <small>CFT</small></div>
                </div>
                <div class="result-item border-top pt-2 mt-2">
                    <span>Value</span>
                    <div class="res-val price">Rs. {{ currentEstimatedValue !== null ? (currentEstimatedValue | number:'1.2-2') : '0.00' }}</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="cft-fab shadow-lg" [class.active]="isOpen" (click)="toggleWidget()" title="CFT Calculator">
        <i class="bi" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-calculator-fill'"></i>
    </button>
</div>
